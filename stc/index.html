<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حوّل لخالد عبر STC Bank</title>
<meta name="theme-color" content="#1c2129">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1c2129;
    --surface: #252b35;
    --line: #343c4a;
    --text: #f4f6f8;
    --muted: #a3acb9;
    --accent: #7ce0b4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    width: 100%;
    max-width: 440px;
    min-height: 100dvh;
    padding: 48px 16px calc(28px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
  }
  .eyebrow { color: var(--muted); font-size: 15px; margin: 0 0 6px; }
  h1 { font-size: 30px; font-weight: 700; margin: 0 0 24px; line-height: 1.3; }

  .number {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
  }
  .number small { display: block; color: var(--muted); font-size: 13px; margin-bottom: 2px; }
  .number bdi { font-size: 26px; font-weight: 600; letter-spacing: 1px; font-variant-numeric: tabular-nums; }

  .go {
    margin-top: 28px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    min-height: 120px;
    padding: 20px;
    background: var(--accent);
    color: var(--bg);
    border-radius: 20px;
    text-decoration: none;
    text-align: center;
    transition: transform .1s, filter .15s;
  }
  .go:active { transform: scale(.98); filter: brightness(.95); }
  .go:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  .go strong { font-size: 24px; font-weight: 700; }
  .go span { font-size: 15px; font-weight: 500; opacity: .85; }

  .steps { color: var(--muted); font-size: 15px; line-height: 1.8; margin: 18px 4px 0; text-align: center; }

  .store { margin-top: auto; padding-top: 28px; text-align: center; font-size: 14px; }
  .store a { color: var(--muted); }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px); opacity: 0;
    background: var(--text); color: var(--bg);
    font-weight: 600; font-size: 15px;
    padding: 10px 18px; border-radius: 999px;
    transition: opacity .2s, transform .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<main>
  <p class="eyebrow">التحويل إلى</p>
  <h1>خالد اللحيدان</h1>

  <div class="number">
    <small>رقم الجوال</small>
    <bdi dir="ltr">053 025 9311</bdi>
  </div>

  <a class="go" id="go" href="stcbank://">
    <strong>افتح STC Bank</strong>
    <span>وينسخ الرقم تلقائياً</span>
  </a>

  <p class="steps">بعد ما يفتح التطبيق، روح للتحويل والصق الرقم.</p>

  <p class="store"><a id="store" href="https://apps.apple.com/sa/app/id6458546150">ما عندك STC Bank؟ حمّله من هنا</a></p>
</main>

<div class="toast" id="toast" role="status" aria-live="polite">تم نسخ الرقم ✓</div>

<script>
  const NUMBER = "0530259311";
  const APP = {
    scheme: "stcbank",
    androidPackage: "sa.com.stcbank",
    iosStore: "https://apps.apple.com/sa/app/id6458546150",
    androidStore: "https://play.google.com/store/apps/details?id=sa.com.stcbank"
  };

  const isAndroid = /Android/i.test(navigator.userAgent || "");
  const go = document.getElementById("go");
  const store = document.getElementById("store");

  if (isAndroid) {
    // Android: open the app by its link; if it isn't installed, Chrome goes to Google Play.
    go.href = "intent://#Intent;scheme=" + APP.scheme + ";package=" + APP.androidPackage +
              ";S.browser_fallback_url=" + encodeURIComponent(APP.androidStore) + ";end";
    store.href = APP.androidStore;
  }

  function fallbackCopy() {
    const t = document.createElement("textarea");
    t.value = NUMBER;
    t.setAttribute("readonly", "");
    t.style.position = "fixed";
    t.style.opacity = "0";
    document.body.appendChild(t);
    t.select();
    t.setSelectionRange(0, NUMBER.length);
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(t);
  }

  function copyNumber() {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(NUMBER).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }
    } catch (e) {
      fallbackCopy();
    }
    const el = document.getElementById("toast");
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 1800);
  }

  // Copy inside the tap, then let the link open the app as a normal tap.
  go.addEventListener("click", copyNumber);
</script>
</body>
</html>
