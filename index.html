<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ادفع لخالد</title>
<meta name="theme-color" content="#1c2129">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1c2129;
    --surface: #252b35;
    --surface-press: #2e3542;
    --line: #343c4a;
    --text: #f4f6f8;
    --muted: #a3acb9;
    --accent: #7ce0b4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    width: 100%;
    max-width: 440px;
    padding: 40px 16px calc(32px + env(safe-area-inset-bottom));
  }
  .eyebrow { color: var(--muted); font-size: 15px; margin: 0 0 6px; }
  h1 { font-size: 30px; font-weight: 700; margin: 0 0 24px; line-height: 1.3; }

  .number {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 28px;
  }
  .number small { display: block; color: var(--muted); font-size: 13px; margin-bottom: 2px; }
  .number bdi { font-size: 22px; font-weight: 600; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  .copy-btn {
    font: inherit; font-size: 14px; font-weight: 600;
    color: var(--bg); background: var(--accent);
    border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer; flex-shrink: 0;
  }

  h2 { font-size: 16px; font-weight: 600; color: var(--muted); margin: 0 0 12px; }

  .apps { display: grid; gap: 12px; }
  .app {
    display: flex; align-items: center; gap: 14px;
    min-height: 76px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    color: inherit; text-decoration: none;
    transition: background .15s, transform .1s;
  }
  .app:active { background: var(--surface-press); transform: scale(.99); }
  .app:focus-visible, .copy-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .badge {
    width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
    display: grid; place-items: center;
    background: #313949; color: var(--accent);
    font-weight: 700; font-size: 18px;
  }
  .app-text { flex: 1; }
  .app-name { display: block; font-size: 19px; font-weight: 700; }
  .app-hint { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .chev { color: var(--muted); font-size: 22px; }

  .note { color: var(--muted); font-size: 13px; line-height: 1.7; margin: 20px 4px 0; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px); opacity: 0;
    background: var(--accent); color: var(--bg);
    font-weight: 600; font-size: 15px;
    padding: 10px 18px; border-radius: 999px;
    transition: opacity .2s, transform .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<main>
  <p class="eyebrow">التحويل إلى</p>
  <h1>خالد اللحيدان</h1>

  <div class="number">
    <div>
      <small>رقم الجوال</small>
      <bdi dir="ltr" id="num">053 025 9311</bdi>
    </div>
    <button class="copy-btn" type="button" id="copy">نسخ الرقم</button>
  </div>

  <h2>اختر التطبيق اللي تحوّل منه</h2>
  <div class="apps">
    <a class="app" data-app="barq" href="#">
      <span class="badge" aria-hidden="true">ب</span>
      <span class="app-text">
        <span class="app-name">برق</span>
        <span class="app-hint">ينسخ الرقم ويفتح التطبيق</span>
      </span>
      <span class="chev" aria-hidden="true">‹</span>
    </a>
    <a class="app" data-app="stcbank" href="#">
      <span class="badge" aria-hidden="true">S</span>
      <span class="app-text">
        <span class="app-name">STC Bank</span>
        <span class="app-hint">ينسخ الرقم ويفتح التطبيق</span>
      </span>
      <span class="chev" aria-hidden="true">‹</span>
    </a>
    <a class="app" data-app="urpay" href="#">
      <span class="badge" aria-hidden="true">U</span>
      <span class="app-text">
        <span class="app-name">urpay</span>
        <span class="app-hint">ينسخ الرقم ويفتح التطبيق</span>
      </span>
      <span class="chev" aria-hidden="true">‹</span>
    </a>
  </div>

  <p class="note">إذا فتح لك المتجر، اضغط «فتح»، وبعدها الصق الرقم في شاشة التحويل.</p>
</main>

<div class="toast" id="toast" role="status" aria-live="polite">تم نسخ الرقم ✓</div>

<script>
  const NUMBER = "0530259311";

  const APPS = {
    barq:    { ios: "https://apps.apple.com/sa/app/id6463204586", android: "https://play.google.com/store/apps/details?id=sa.com.barraq" },
    stcbank: { ios: "https://apps.apple.com/sa/app/id6458546150", android: "https://play.google.com/store/apps/details?id=sa.com.stcbank" },
    urpay:   { ios: "https://apps.apple.com/sa/app/id1585778338", android: "https://play.google.com/store/apps/details?id=com.urpay.consumer" }
  };

  const ua = navigator.userAgent || "";
  const isAndroid = /Android/i.test(ua);
  const platform = isAndroid ? "android" : "ios";

  function copyNumber() {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(NUMBER).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }
    } catch (e) {
      fallbackCopy();
    }
    showToast();
  }

  function fallbackCopy() {
    const t = document.createElement("textarea");
    t.value = NUMBER;
    t.setAttribute("readonly", "");
    t.style.position = "fixed";
    t.style.opacity = "0";
    document.body.appendChild(t);
    t.select();
    t.setSelectionRange(0, NUMBER.length);
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(t);
  }

  let toastTimer;
  function showToast() {
    const el = document.getElementById("toast");
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
  }

  document.getElementById("copy").addEventListener("click", copyNumber);

  document.querySelectorAll(".app").forEach((a) => {
    a.href = APPS[a.dataset.app][platform];
    // Copy inside the tap itself, then let the link open normally
    // so the phone treats it as a real tap and hands it to the app store app.
    a.addEventListener("click", copyNumber);
  });
</script>
</body>
</html>
